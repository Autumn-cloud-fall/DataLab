name: Autograding Tests
"on":
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Operator Check
        id: operator-check
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: Operator Check
          setup-command: sudo apt-get install gcc-multilib && make clean
            && make all
          command: chmod +x dlc check_ops.py && ./check_ops.py bits.c
          input: ""
          expected-output: "All 19 functions passed operator checks."
          comparison-method: contains
          timeout: 10
          max-score: 100
      - name: signMask
        id: signmask
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: signMask
          setup-command: sudo apt-get install gcc-multilib && make clean
            && make all
          command: ./btest -f signMask
          input: ""
          expected-output: "Total points: 1/1"
          comparison-method: contains
          timeout: 10
          max-score: 1
      - name: bitXor
        id: bitxor
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: bitXor
          setup-command: sudo apt-get install gcc-multilib && make clean
            && make all
          command: ./btest -f bitXor
          input: ""
          expected-output: "Total points: 2/2"
          comparison-method: contains
          timeout: 10
          max-score: 2
      - name: negativePart
        id: negativepart
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: negativePart
          setup-command: sudo apt-get install gcc-multilib && make clean
            && make all
          command: ./btest -f negativePart
          input: ""
          expected-output: "Total points: 3/3"
          comparison-method: contains
          timeout: 10
          max-score: 3
      - name: copyByteWithin
        id: copybytewithin
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: copyByteWithin
          setup-command: sudo apt-get install gcc-multilib && make clean
            && make all
          command: ./btest -f copyByteWithin
          input: ""
          expected-output: "Total points: 4/4"
          comparison-method: contains
          timeout: 10
          max-score: 4
      - name: logicalShift
        id: logicalshift
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: logicalShift
          setup-command: sudo apt-get install gcc-multilib && make clean
