name: Autograding Tests
"on":
  - push
  - repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup runs once instead of once per test. The original workflow used the
      # io-grader's `setup-command` on every test, rebuilding the lab 20 times.
      # Built without -m32: the runner has no gcc-multilib, and int/unsigned are
      # 32-bit on x86-64 anyway.
      - name: Setup
        run: |
          make clean
          make all CFLAGS='-O -Wall -fwrapv'

      - name: Operator Check
        id: operator-check
        env:
          TEST_NAME: Operator Check
          GRADER_COMMAND: "chmod +x dlc check_ops.py && ./check_ops.py bits.c"
          EXPECTED_OUTPUT: "All 19 functions passed operator checks."
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "100"
        run: bash .github/scripts/autograde.sh

      - name: signMask
        id: signmask
        env:
          TEST_NAME: signMask
          GRADER_COMMAND: "./btest -f signMask"
          EXPECTED_OUTPUT: "Total points: 1/1"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "1"
        run: bash .github/scripts/autograde.sh

      - name: bitXor
        id: bitxor
        env:
          TEST_NAME: bitXor
          GRADER_COMMAND: "./btest -f bitXor"
          EXPECTED_OUTPUT: "Total points: 2/2"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "2"
        run: bash .github/scripts/autograde.sh

      - name: negativePart
        id: negativepart
        env:
          TEST_NAME: negativePart
          GRADER_COMMAND: "./btest -f negativePart"
          EXPECTED_OUTPUT: "Total points: 3/3"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "3"
        run: bash .github/scripts/autograde.sh

      - name: copyByteWithin
        id: copybytewithin
        env:
          TEST_NAME: copyByteWithin
          GRADER_COMMAND: "./btest -f copyByteWithin"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: logicalShift
        id: logicalshift
        env:
          TEST_NAME: logicalShift
          GRADER_COMMAND: "./btest -f logicalShift"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: swapNibblePairs
        id: swapnibblepairs
        env:
          TEST_NAME: swapNibblePairs
          GRADER_COMMAND: "./btest -f swapNibblePairs"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: secondLowestZeroBit
        id: secondlowestzerobit
        env:
          TEST_NAME: secondLowestZeroBit
          GRADER_COMMAND: "./btest -f secondLowestZeroBit"
          EXPECTED_OUTPUT: "Total points: 4/4"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "4"
        run: bash .github/scripts/autograde.sh

      - name: oddParity
        id: oddparity
        env:
          TEST_NAME: oddParity
          GRADER_COMMAND: "./btest -f oddParity"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "5"
        run: bash .github/scripts/autograde.sh

      - name: rotateRightBits
        id: rotaterightbits
        env:
          TEST_NAME: rotateRightBits
          GRADER_COMMAND: "./btest -f rotateRightBits"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "5"
        run: bash .github/scripts/autograde.sh

      - name: roundEvenPow2
        id: roundevenpow2
        env:
          TEST_NAME: roundEvenPow2
          GRADER_COMMAND: "./btest -f roundEvenPow2"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "5"
        run: bash .github/scripts/autograde.sh

      - name: midpointTowardFirst
        id: midpointtowardfirst
        env:
          TEST_NAME: midpointTowardFirst
          GRADER_COMMAND: "./btest -f midpointTowardFirst"
          EXPECTED_OUTPUT: "Total points: 5/5"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "5"
        run: bash .github/scripts/autograde.sh

      - name: isBetweenEitherOrder
        id: isbetweeneitherorder
        env:
          TEST_NAME: isBetweenEitherOrder
          GRADER_COMMAND: "./btest -f isBetweenEitherOrder"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: mul5Sat
        id: mul5sat
        env:
          TEST_NAME: mul5Sat
          GRADER_COMMAND: "./btest -f mul5Sat"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: classifyAdd3
        id: classifyadd3
        env:
          TEST_NAME: classifyAdd3
          GRADER_COMMAND: "./btest -f classifyAdd3"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: floatScaleThreeHalves
        id: floatscalethreehalves
        env:
          TEST_NAME: floatScaleThreeHalves
          GRADER_COMMAND: "./btest -f floatScaleThreeHalves"
          EXPECTED_OUTPUT: "Total points: 7/7"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "7"
        run: bash .github/scripts/autograde.sh

      - name: floatRoundEven
        id: floatroundeven
        env:
          TEST_NAME: floatRoundEven
          GRADER_COMMAND: "./btest -f floatRoundEven"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: float_i2f
        id: float_i2f
        env:
          TEST_NAME: float_i2f
          GRADER_COMMAND: "./btest -f float_i2f"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: bitCount
        id: bitcount
        env:
          TEST_NAME: bitCount
          GRADER_COMMAND: "./btest -f bitCount"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: bitReverse
        id: bitreverse
        env:
          TEST_NAME: bitReverse
          GRADER_COMMAND: "./btest -f bitReverse"
          EXPECTED_OUTPUT: "Total points: 10/10"
          COMPARISON_METHOD: contains
          TIMEOUT_MINUTES: "10"
          MAX_SCORE: "10"
        run: bash .github/scripts/autograde.sh

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          OPERATOR-CHECK_RESULTS: "${{steps.operator-check.outputs.result}}"
          SIGNMASK_RESULTS: "${{steps.signmask.outputs.result}}"
          BITXOR_RESULTS: "${{steps.bitxor.outputs.result}}"
          COPYBYTEWITHIN_RESULTS: "${{steps.copybytewithin.outputs.result}}"
          ROUNDEVENPOW2_RESULTS: "${{steps.roundevenpow2.outputs.result}}"
          NEGATIVEPART_RESULTS: "${{steps.negativepart.outputs.result}}"
          ISBETWEENEITHERORDER_RESULTS: "${{steps.isbetweeneitherorder.outputs.result}}"
          LOGICALSHIFT_RESULTS: "${{steps.logicalshift.outputs.result}}"
          SWAPNIBBLEPAIRS_RESULTS: "${{steps.swapnibblepairs.outputs.result}}"
          SECONDLOWESTZEROBIT_RESULTS: "${{steps.secondlowestzerobit.outputs.result}}"
          ROTATERIGHTBITS_RESULTS: "${{steps.rotaterightbits.outputs.result}}"
          MIDPOINTTOWARDFIRST_RESULTS: "${{steps.midpointtowardfirst.outputs.result}}"
          CLASSIFYADD3_RESULTS: "${{steps.classifyadd3.outputs.result}}"
          MUL5SAT_RESULTS: "${{steps.mul5sat.outputs.result}}"
          FLOATROUNDEVEN_RESULTS: "${{steps.floatroundeven.outputs.result}}"
          FLOATSCALETHREEHALVES_RESULTS: "${{steps.floatscalethreehalves.outputs.result}}"
          FLOAT_I2F_RESULTS: "${{steps.float_i2f.outputs.result}}"
          ODDPARITY_RESULTS: "${{steps.oddparity.outputs.result}}"
          BITCOUNT_RESULTS: "${{steps.bitcount.outputs.result}}"
          BITREVERSE_RESULTS: "${{steps.bitreverse.outputs.result}}"
        with:
          runners: operator-check,signmask,bitxor,negativepart,copybytewithin,logicalshift,swapnibblepairs,secondlowestzerobit,oddparity,rotaterightbits,roundevenpow2,midpointtowardfirst,isbetweeneitherorder,mul5sat,classifyadd3,floatscalethreehalves,floatroundeven,float_i2f,bitcount,bitreverse
