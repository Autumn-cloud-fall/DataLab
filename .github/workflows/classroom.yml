      - name: floatScaleThreeHalves
        id: floatscalethreehalves
        uses: classroom-resources/autograding-io-grader@v1
        with:
          test-name: floatScaleThreeHalves
          setup-command: sudo apt-get install gcc-multilib && make clean
            && make all
          command: ./btest -f floatScaleThreeHalves
